<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>留声 · 音视频转文字</title><link rel="stylesheet" href="/workbench/assets/transcribe.css"><script type="module" src="/workbench/assets/transcribe.js"></script></head><body>
<a class="skip" href="#main">跳到正文</a><aside class="sidebar" id="sidebar" aria-label="转录记录"><div class="brand-row"><a class="brand" href="/workbench/">留声 <span>〰</span></a><button class="icon sidebar-close" id="close-sidebar" aria-label="关闭侧栏">×</button></div><button id="new-transcript" class="new-transcript">＋ 新转录</button><input id="search" type="search" placeholder="搜索转录" aria-label="搜索转录" maxlength="200"><div class="history-heading"><select id="history-view" aria-label="记录范围"><option value="library">最近转录</option><option value="archive">已归档</option><option value="trash">回收站</option></select><select id="status-filter" aria-label="筛选状态"><option value="">全部</option><option value="active">进行中</option><option value="completed">已完成</option><option value="failed">失败</option></select></div><div id="history-list" class="history-list"></div><div class="pagination"><button id="previous" aria-label="上一页">←</button><span id="page-number"></span><button id="next" aria-label="下一页">→</button></div><footer class="sidebar-footer"><button id="settings" class="subtle">外观</button><span id="connection" class="connection" aria-label="连接正常"></span></footer></aside>
<button id="sidebar-backdrop" class="sidebar-backdrop" aria-label="关闭侧栏" hidden></button><div class="main-shell"><header class="mobile-header"><button id="open-sidebar" class="icon" aria-label="打开转录记录">☰</button><span>留声</span><button id="mobile-new" class="icon" aria-label="新转录">＋</button></header><div id="network" class="network" role="status" hidden></div><main id="main" tabindex="-1"><section id="start" class="start"><div class="intro"><div class="soundmark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><h1>把声音，留成文字。</h1></div>
<form id="transcribe-form" class="composer"><label class="sr-only" for="video-url">音视频链接</label><textarea id="video-url" rows="2" placeholder="粘贴视频或播客链接…" maxlength="4096"></textarea><div id="file-preview" class="file-preview" hidden><span id="file-name"></span><button type="button" id="remove-file" class="icon" aria-label="移除文件">×</button></div><div class="composer-toolbar"><div class="composer-options"><button type="button" id="choose-file" class="subtle">＋ 上传文件</button><input type="file" id="upload-file" accept=".txt,.mp3,.mp4,.wav,.m4a,.webm,.mkv,.ogg,.flac,.mov" hidden><details class="options"><summary>选项 ⌄</summary><div class="option-panel"><label for="language">输出语言</label><select id="language"><option value="zh">简体中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ru">Русский</option><option value="ar">العربية</option></select><label class="check"><input type="checkbox" id="keep-video">保留视频文件</label></div></details></div><button type="submit" id="submit" class="primary">开始转录 ↗</button></div><div id="upload-progress" hidden><progress id="progress" max="100" value="0"></progress><span id="progress-label"></span></div></form>
<p id="form-error" class="form-error" role="alert" hidden></p><p class="formats">YouTube、B 站等媒体链接 · 或直接上传音视频</p><section id="recent" class="recent" aria-label="最近转录"><h2>最近转录</h2><div id="recent-list"></div></section></section><section id="result" class="result" hidden aria-label="转录结果"><div id="result-content"></div><p id="action-error" class="form-error" role="alert" hidden></p></section></main></div>
<div id="toast" class="toast" role="status" hidden></div><dialog id="confirm-dialog" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-description"></p><div class="dialog-actions"><button value="cancel">取消</button><button id="confirm-accept" value="accept" class="primary">确认</button></div></form></dialog><dialog id="settings-dialog" aria-labelledby="settings-title"><form method="dialog"><div class="dialog-title"><h2 id="settings-title">外观</h2><button class="icon" aria-label="关闭外观设置">×</button></div><label for="theme">主题</label><select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select><label for="font-size">正文字号</label><select id="font-size"><option value="normal">标准</option><option value="large">较大</option></select></form></dialog></body></html>
